# JD9853 2.01" IPS 240x296 in landscape (296x240) instead of the ST7735. Wired like the ST7735:
# SCL and SDA on the SPI bus, CS GPIO17, DC GPIO18, RES GPIO08, BL on the backlight pin.
# Use it after webradio.yaml: files: [webradio.yaml, displays/jd9853-296x240.yaml]
substitutions:
  screen_width: 296
  screen_height: 240
  # The panel's corners have a radius of 61 px (R8.2 mm at 0.1335 mm per pixel); the top and
  # bottom rows keep 15 px more distance from the sides.
  corner_inset: 15

display:
  - id: !remove tft_display
  - platform: mipi_spi
    id: jd9853_display
    model: CUSTOM
    data_rate: 40MHz
    dimensions:
      width: 296
      height: 240
    # Landscape by swapping the axes only. Mirroring the controller's 320-row axis would move the
    # picture to rows 24-319 of its memory and cut 24 px off one edge.
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    cs_pin: GPIO17
    dc_pin: GPIO18
    reset_pin: GPIO08
    # Register setup from LovyanGFX's Panel_JD9853 (FreeBSD licence):
    # https://github.com/lovyan03/LovyanGFX/blob/master/src/lgfx/v1/panel/Panel_JD9853.hpp
    # Reset, pixel format, MADCTL, inversion, sleep out and display on are sent by mipi_spi.
    init_sequence:
      - [0xDF, 0x98, 0x53]
      - [0xDE, 0x00]
      - [0xB2, 0x38]
      - [0xB7, 0x00, 0x29, 0x00, 0x51]
      - [0xBB, 0x28, 0x2F, 0x55, 0x73, 0x63, 0xF0]
      - [0xC0, 0x22, 0xA2]
      - [0xC1, 0x12]
      - [0xC3, 0x7D, 0x08, 0x08, 0x0C, 0xC2, 0x72, 0x22, 0x88]
      - [0xC4, 0x00, 0x00, 0xA0, 0x79, 0x0A, 0x0B, 0x16, 0x79, 0x0A, 0x0B, 0x16, 0x82]
      - [0xC8, 0x3F, 0x29, 0x23, 0x20, 0x27, 0x2D, 0x2A, 0x2B, 0x2A, 0x28, 0x25, 0x17, 0x12, 0x0D, 0x07, 0x02,
         0x3F, 0x29, 0x23, 0x20, 0x27, 0x2D, 0x2A, 0x2B, 0x2A, 0x28, 0x25, 0x17, 0x12, 0x0D, 0x07, 0x02]
      - [0xD0, 0x04, 0x04, 0x6A, 0x1C, 0x03]
      - [0xD7, 0x00, 0x20]
      - [0xE6, 0x10]
      - [0xDE, 0x01]
      - [0xBB, 0x04]
      - [0xD7, 0x12]
      - [0xB7, 0x03, 0x13, 0xE5, 0x38, 0x38]
      - [0xC1, 0x14, 0x15, 0xC0]
      - [0xC2, 0x06, 0x3A]
      - [0xC4, 0x72, 0x12]
      - [0xBE, 0x00]
      - [0xDE, 0x00]

# The transform above already turns the picture; LVGL must not rotate it again.
lvgl:
  rotation: 0
