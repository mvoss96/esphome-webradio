# ESPHome web radio: ESP32-S3, MAX98357A, ST7735 160x128 (or another display, see displays/), rotary encoder.
# Use as a package next to the device's name and Wi-Fi/API settings, see example/web-radio.yaml.

substitutions:
  # Lowest frequency sent to the speaker. 90 Hz suits a Visaton FRS 8 M in a closed 1 l box;
  # override it in the device file for another speaker or enclosure.
  highpass_frequency: 90Hz
  # Tabler icon font, pinned so the icon code points cannot change.
  tabler_font: https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.50.0/dist/fonts/tabler-icons.ttf
  # Display size in pixels as the UI sees it, after rotation. The layout is drawn for 160x128;
  # positions and widths are scaled by sx, heights by sy, fonts, radii and square parts by sf.
  # Another display: see displays/ for a package that sets these and the display itself.
  screen_width: 160
  screen_height: 128
  # Extra distance from the sides for the top and bottom rows, for panels with rounded corners.
  corner_inset: 0
  sx: ${screen_width / 160}
  sy: ${screen_height / 128}
  sf: ${[screen_width / 160, screen_height / 128] | min}
  # Sizes shared with the C++ components: carousel tiles and the stored logo and cover size.
  tile_center: ${(68*sf)|round|int}
  tile_side: ${(40*sf)|round|int}
  logo_size: ${(74*sf)|round|int}
  # Bottom row of the playing screen: its width and where the playing bars start in it.
  row_width: ${(144*sx)|round|int - 2*corner_inset}
  bars_x: ${(144*sx)|round|int - 2*corner_inset - (13*sx)|round|int}

esphome:
  project:
    name: mvoss.web-radio
    version: "1.20.0"
  on_boot:
    priority: -100
    then:
      # Startup page: a short segment runs back and forth on the track until Wi-Fi connects.
      - lambda: |-
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, id(boot_seg));
          lv_anim_set_values(&a, ${(50*sx)|round|int}, ${(50*sx)|round|int + (60*sx)|round|int - (16*sx)|round|int});
          lv_anim_set_duration(&a, 700);
          lv_anim_set_playback_duration(&a, 700);
          lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&a, [](void *o, int32_t v) { lv_obj_set_x((lv_obj_t *) o, v); });
          lv_anim_start(&a);
      - lambda: |-
          static const uint8_t silence[960] = {0};
          id(i2s_speaker).play(silence, sizeof(silence));
      - delay: 500ms
      - lambda: id(i2s_speaker).stop();
      # Restored EQ values do not run the number set_action, so apply them here.
      - lambda: |-
          id(speaker_eq).set_band_gain(1, -id(eq_bass).state);
          id(speaker_eq).set_band_gain(2, id(eq_mid).state);
          id(speaker_eq).set_band_gain(3, id(eq_treble).state);
      - script.execute: load_stations
      - script.execute: refresh_volume

esp32:
  variant: ESP32S3
  flash_size: 8MB
  # Storage for station logos. ESPHome shrinks the two app partitions to make room.
  partitions:
    - name: logos
      type: data
      subtype: spiffs
      size: 0x180000
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

external_components:
  - source: github://mvoss96/esphome-webradio@main
    components: [equalizer, station_logos, radio_ui, radio_web]
    refresh: 10s
  # AirPlay receiver (hub, media source, text sensors, cover image).
  - source: github://mvoss96/esphome-airplay@v0.9.0
    components: [airplay]

# Decoders for the radio streams. FLAC comes from the media pipeline format.
audio:
  codecs:
    mp3:
    opus:

# Station logos from radio-browser.info, resized by wsrv.nl, kept in PSRAM.
station_logos:
  id: logos
  size: ${logo_size}

# Carousel rendering (C++ helpers); screen and tile sizes from the substitutions.
radio_ui:
  screen_width: ${screen_width}
  screen_height: ${screen_height}
  tile_center: ${tile_center}
  tile_side: ${tile_side}

# Web page at http://<radio>/: control playback, and edit the station list under #sender.
radio_web:
  stations: !lambda |-
    const auto &names = id(station_names);
    const auto &urls = id(station_urls);
    const auto &logos = id(station_logo_urls);
    std::string out;
    for (size_t i = 0; i < names.size(); i++)
      out += names[i] + "\t" + urls[i] + "\t" + (i < logos.size() ? logos[i] : "") + "\n";
    return out;
  # The same state as the display: the shown source, playing or paused, and its title and artist.
  status: !lambda |-
    auto *player = id(media_player_sendspin);
    auto json_text = [](const std::string &s) {
      std::string out = "\"";
      for (const char c : s) {
        if (c == '"' || c == '\\') out += '\\';
        if ((unsigned char) c >= 0x20) out += c;
      }
      return out + "\"";
    };
    const bool on = id(is_now_playing);
    const char *source = !on ? "" : id(radio_active) ? "radio" : id(airplay_active) ? "airplay" : "sendspin";
    std::string title, artist;
    if (on && !id(radio_active)) {
      title = id(airplay_active) ? id(airplay_title).state : id(sendspin_title).state;
      artist = id(airplay_active) ? id(airplay_artist).state : id(sendspin_artist).state;
    }
    char buf[224];
    snprintf(buf, sizeof(buf),
             "{\"station\":%d,\"source\":\"%s\",\"paused\":%s,\"live\":%s,\"volume\":%d,\"muted\":%s,\"ha\":%s,"
             "\"bass\":%.1f,\"mid\":%.1f,\"treble\":%.1f,\"dim\":%d,",
             id(station_index), source,
             player->state == media_player::MEDIA_PLAYER_STATE_PAUSED ? "true" : "false",
             on && id(progress_live) ? "true" : "false",
             (int) lroundf(player->volume * 100), player->is_muted() ? "true" : "false",
             esphome::api::global_api_server->is_connected() ? "true" : "false",
             id(eq_bass).state, id(eq_mid).state, id(eq_treble).state, (int) id(dim_after).state);
    return std::string(buf) + "\"title\":" + json_text(title) + ",\"artist\":" + json_text(artist) + "}";
  # The cover the display shows, for the page.
  cover: !lambda |-
    if (!id(is_now_playing) || id(radio_active)) return nullptr;
    if (id(airplay_active))
      return id(airplay_has_cover) ? static_cast<image::Image *>(id(airplay_cover)) : nullptr;
    return id(sendspin_has_cover) ? static_cast<image::Image *>(id(sendspin_cover_art)) : nullptr;
  on_save:
    - script.execute:
        id: store_stations
        text: !lambda "return text;"
  on_play:
    - script.execute:
        id: play_station
        idx: !lambda "return index;"
  on_volume:
    - media_player.volume_set:
        id: media_player_sendspin
        volume: !lambda "return clamp(volume, 0, 100) / 100.0f;"
  on_stop:
    - media_player.stop: media_player_sendspin
  on_pause:
    - media_player.pause: media_player_sendspin
  on_resume:
    - media_player.play: media_player_sendspin
  # Settings from the web page: bass, mid, treble (dB) and dim (seconds).
  on_setting:
    - lambda: |-
        esphome::number::Number *num = nullptr;
        if (key == "bass") num = id(eq_bass);
        else if (key == "mid") num = id(eq_mid);
        else if (key == "treble") num = id(eq_treble);
        else if (key == "dim") num = id(dim_after);
        if (num == nullptr) {
          ESP_LOGW("radio_web", "Unknown setting '%s'", key.c_str());
          return;
        }
        auto call = num->make_call();
        call.set_value(value);
        call.perform();

########################################################################

# The module has only 2 MB PSRAM. ignore_not_found must stay at its default (true):
# with false, ESPHome treats PSRAM as guaranteed and enables network buffers sized
# for 8 MB modules (512 RX buffers, 512 KB TCP windows), which fill the PSRAM while
# streaming and make allocations fail all over the firmware.
psram:
  mode: quad
  speed: 80MHz

spi:
  clk_pin: GPIO16
  mosi_pin: GPIO15

i2s_audio:
  id: i2s_output
  i2s_lrclk_pin: GPIO05
  i2s_bclk_pin: GPIO04

globals:
  - id: wifi_connected
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: is_now_playing
    type: bool
    restore_value: false
    initial_value: 'false'

  # Knob steps not yet applied to the volume, see apply_volume.
  - id: volume_steps
    type: int
    restore_value: false
    initial_value: '0'

  # Station list as "name<TAB>url<TAB>logo-url<NEWLINE>" lines, saved in flash.
  # The logo URL is optional. 6 KB holds about 50 stations.
  - id: station_blob
    type: std::array<char, 6144>
    restore_value: true

  # Parsed copy of station_blob for quick access.
  - id: station_names
    type: std::vector<std::string>
  - id: station_urls
    type: std::vector<std::string>
  - id: station_logo_urls
    type: std::vector<std::string>

  # Last played station, started by a click on the clock screen.
  - id: station_index
    type: int
    restore_value: true
    initial_value: '0'

  # AirPlay plays (set by check_source); radio_active is false then.
  - id: airplay_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # The AirPlay sender has sent a cover for the current track.
  - id: airplay_has_cover
    type: bool
    restore_value: false
    initial_value: 'false'

  # True while a station from the list plays, false for Sendspin.
  - id: radio_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Shown page: 0 clock, 1 playing, 2 carousel, 3 info, 5 boot, 6 OTA.
  - id: ui_page
    type: int
    restore_value: false
    initial_value: '5'

  # Carousel: menu (0 main, 1 settings), selected tile, index of the first
  # station tile in the main menu, and whether a value is being edited.
  - id: menu
    type: int
    restore_value: false
    initial_value: '0'
  - id: menu_first
    type: int
    restore_value: false
    initial_value: '1'
  # Station shown first in the main menu because it plays, -1 for none.
  - id: menu_front
    type: int
    restore_value: false
    initial_value: '-1'
  - id: menu_sel
    type: int
    restore_value: false
    initial_value: '0'
  - id: menu_edit
    type: bool
    restore_value: false
    initial_value: 'false'

  # The playing screen shows the bottom row (playing bars, and progress for tracks).
  - id: progress_shown
    type: bool
    restore_value: false
    initial_value: 'false'

  # How far the volume row has slid in over the bottom row: 0 bottom row, 255 volume row (swap_rows).
  - id: vol_row_pos
    type: int
    restore_value: false
    initial_value: '0'

  # What plays has no end (a station, a live stream, or no length known): the row shows only the bars.
  - id: progress_live
    type: bool
    restore_value: false
    initial_value: 'false'

  # A Sendspin cover is available, and the playing screen background needs a new backdrop.
  - id: sendspin_has_cover
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: backdrop_dirty
    type: bool
    restore_value: false
    initial_value: 'true'

  # Equalizer page: selected band (0 bass, 1 mid, 2 treble) and whether turning edits it.
  - id: eq_sel
    type: int
    restore_value: false
    initial_value: '0'
  - id: eq_edit
    type: bool
    restore_value: false
    initial_value: 'false'

  # True while the clock is dimmed; the first knob input then only wakes it.
  - id: display_dimmed
    type: bool
    restore_value: false
    initial_value: 'false'

wifi:
  # Without power saving the radio answers in a few ms instead of 200-2000 ms; MA and the Home tile need that.
  power_save_mode: none
  on_connect:
    - globals.set:
        id: wifi_connected
        value: 'true'
    - if:
        condition:
          lambda: "return id(ui_page) == 5;"
        then:
          - lambda: |-
              lv_anim_delete(id(boot_seg), nullptr);
              lv_obj_add_flag(id(boot_seg), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(lbl_boot_status), "Verbunden");
          - delay: 700ms
          - if:
              condition:
                lambda: "return id(ui_page) == 5;"
              then:
                - script.execute: show_idle

# The radio works without Home Assistant: no reboot when no API client is connected.
api:
  reboot_timeout: 0s
  actions:
    # Replace the station list from Home Assistant with three lists of equal length.
    # logos may contain empty strings; those stations get a looked-up logo.
    - action: set_stations
      variables:
        names: string[]
        urls: string[]
        logos: string[]
      then:
        - script.execute:
            id: store_stations
            text: !lambda |-
              auto clean = [](std::string s) {
                for (char &c : s)
                  if (c == '\t' || c == '\n' || c == '\r') c = ' ';
                return s;
              };
              std::string out;
              for (size_t i = 0; i < std::min(names.size(), urls.size()); i++)
                out += clean(names[i]) + "\t" + clean(urls[i]) + "\t" + (i < logos.size() ? clean(logos[i]) : "") + "\n";
              return out;

    # Play station number 1..n from Home Assistant.
    - action: play_station
      variables:
        nummer: int
      then:
        - script.execute:
            id: play_station
            idx: !lambda "return nummer - 1;"

time:
  - platform: sntp
    id: ha_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    timezone: "Europe/Berlin"
    on_time_sync:
      - script.execute: update_time_labels
    on_time:
      - seconds: 0
        then:
          - script.execute: update_time_labels

interval:
  # The logo task cannot touch LVGL; redraw here when new logos arrived.
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: "return id(logos)->take_changed();"
          then:
            - script.execute: refresh_logos
      - script.execute: check_source
  # Playing bars of the playing screen: they move while something plays and rest at 3 px otherwise.
  - interval: 60ms
    then:
      - lambda: |-
          static bool moving = false;
          const bool on = id(ui_page) == 1 &&
                          id(media_player_sendspin).state == media_player::MEDIA_PLAYER_STATE_PLAYING &&
                          !lv_obj_has_flag(id(now_prog), LV_OBJ_FLAG_HIDDEN);
          if (!on && !moving) return;
          moving = on;
          static const float SPEED[3] = {9.0f, 6.5f, 7.8f};
          const float t = millis() / 1000.0f;
          lv_obj_t *bars[3] = {id(ind0), id(ind1), id(ind2)};
          for (int i = 0; i < 3; i++) {
            const int h = on ? ${(3*sf)|round|int} + (int) (${(9*sy)|round|int} * std::fabs(std::sin(t * SPEED[i] + i))) : ${(3*sf)|round|int};
            lv_obj_set_y(bars[i], ${(16*sy)|round|int} - h);
            lv_obj_set_height(bars[i], h);
          }

ota:
  - platform: esphome
    on_begin:
      - media_player.stop: media_player_sendspin
      - script.stop: vol_idle
      - script.stop: menu_timeout
      - script.stop: display_wake
      - globals.set:
          id: ui_page
          value: '6'
      - light.turn_on:
          id: tft_backlight
          brightness: 100%
      # The main loop stalls during the upload, so the light and the media player stop
      # would only take effect afterwards. Set the backlight output and mute the I2S
      # speaker directly; the speaker applies its mute in its own task.
      - lambda: |-
          id(output_blk).set_level(1.0f);
          id(i2s_speaker).set_mute_state(true);
      - lvgl.page.show: ota_page
      - lambda: lv_task_handler();
      - delay: 300ms
    on_progress:
      - lambda: |-
          lv_bar_set_value(id(bar_ota), (int) x, LV_ANIM_OFF);
          char buf[12];
          snprintf(buf, sizeof(buf), "%.0f %%", x);
          lv_label_set_text(id(lbl_ota_pct), buf);
          lv_task_handler();
    on_end:
      - lambda: |-
          lv_label_set_text(id(lbl_ota_title), "Update fertig");
          lv_bar_set_value(id(bar_ota), 100, LV_ANIM_OFF);
          lv_obj_add_flag(id(lbl_ota_pct), LV_OBJ_FLAG_HIDDEN);
          lv_task_handler();
    on_error:
      - lambda: id(i2s_speaker).set_mute_state(false);
      # The bar stays where it stopped and turns grey; the old firmware keeps running.
      - lambda: |-
          lv_label_set_text(id(lbl_ota_title), "Update fehlgeschlagen");
          lv_obj_set_style_bg_color(id(bar_ota), lv_color_hex(0x787880), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(lbl_ota_pct), lv_color_hex(0x787880), 0);

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    sample_rate: 48000
    id: i2s_speaker
    i2s_dout_pin: GPIO06
    bits_per_sample: 16bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: mono
    # Covers short stalls of the AirPlay task, e.g. during fast volume changes.
    buffer_duration: 500ms

  # EQ tuned for the Visaton FRS 8 M in the closed 1 L case (box resonance ~180 Hz).
  - platform: equalizer
    id: speaker_eq
    output_speaker: i2s_speaker
    bands:
      # 0: Protect the cone from bass it cannot reproduce.
      - type: high_pass
        frequency: ${highpass_frequency}
        q: 0.707
      # 1: Bass balance. Lowers everything above 150 Hz instead of boosting
      #    below, so the signal can never clip. Gain = -"EQ Bass".
      - type: high_shelf
        frequency: 150Hz
        gain: -6dB
        q: 0.707
      # 2: Mid
      - type: peaking
        frequency: 1000Hz
        gain: 0dB
        q: 1.0
      # 3: Treble
      - type: high_shelf
        frequency: 8000Hz
        gain: 0dB
        q: 0.707

switch:
  - platform: template
    name: "EQ Enabled"
    id: eq_enabled
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: "id(speaker_eq).set_enabled(true);"
    turn_off_action:
      - lambda: "id(speaker_eq).set_enabled(false);"

number:
  # Seconds without knob input before the display dims, on every screen; 0 = never.
  - platform: template
    name: "Display abdunkeln nach"
    id: dim_after
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 300
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 2;"
          then:
            - script.execute: render_menu

  - platform: template
    name: "EQ Bass"
    id: eq_bass
    entity_category: config
    min_value: 0
    max_value: 9
    step: 0.5
    initial_value: 6
    optimistic: true
    restore_value: true
    set_action:
      - lambda: "id(speaker_eq).set_band_gain(1, -x);"
    # Only while a menu is open; at boot LVGL is not ready yet.
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 2;"
          then:
            - script.execute: render_menu
      - if:
          condition:
            lambda: "return id(ui_page) == 4;"
          then:
            - script.execute: render_eq

  - platform: template
    name: "EQ Mid"
    id: eq_mid
    entity_category: config
    min_value: -12
    max_value: 6
    step: 0.5
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: "id(speaker_eq).set_band_gain(2, x);"
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 4;"
          then:
            - script.execute: render_eq

  - platform: template
    name: "EQ Treble"
    id: eq_treble
    entity_category: config
    min_value: -12
    max_value: 6
    step: 0.5
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: "id(speaker_eq).set_band_gain(3, x);"
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 2;"
          then:
            - script.execute: render_menu
      - if:
          condition:
            lambda: "return id(ui_page) == 4;"
          then:
            - script.execute: render_eq

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

airplay:
  name: Web Radio
  task_stack_in_psram: true
  airplay2: true
  # Second, pure AirPlay 1 _raop service ("Web Radio (iTunes)") so senders that
  # reject any AirPlay 2 hint, such as iTunes for Windows, can play.
  itunes: true

media_source:
  - platform: sendspin
    id: sendspin_source
    # Default is 1 MB, half of this module's 2 MB PSRAM. The server only sends
    # as much ahead as the client reports, so a smaller buffer is safe.
    buffer_size: 300000
  - platform: audio_http
    id: http_source
  - platform: airplay
    id: airplay_source
    output_queue: 400ms

media_player:
  - platform: speaker_source
    name: Media Player
    id: media_player_sendspin
    media_pipeline:
      speaker: speaker_eq
      format: FLAC
      sources:
        - sendspin_source
        - http_source
        - airplay_source
    on_state:
      - script.execute: check_source
    on_play:
      - script.stop: idle_timeout
      - lvgl.widget.hide: pause_overlay
      - lvgl.widget.show: [ind0, ind1, ind2]
      # The cover is shown and hidden only by the Sendspin image events; it can arrive
      # before playback starts, so hiding it here lost it.
      - globals.set:
          id: is_now_playing
          value: 'true'
      - if:
          condition:
            lambda: "return id(ui_page) <= 1;"
          then:
            - script.execute: show_playing
      # In the main menu, stay there but show the playing tile right away.
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu) == 0;"
          then:
            - script.execute: render_menu
    on_pause:
      - if:
          condition:
            lambda: "return !id(radio_active);"
          then:
            - lvgl.widget.hide: [ind0, ind1, ind2]
            - lvgl.widget.show: pause_overlay
    on_idle:
      - globals.set:
          id: is_now_playing
          value: 'false'
      - lvgl.widget.hide: pause_overlay
      - lvgl.widget.show: [ind0, ind1, ind2]
      - if:
          condition:
            lambda: "return id(ui_page) == 1;"
          then:
            - script.execute: idle_timeout
      # The first main menu tile follows what plays.
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu) == 0;"
          then:
            - script.execute: render_menu
    on_volume:
      # A volume above zero ends a mute from Home Assistant or Music Assistant; the
      # player keeps the mute flag separately and restores it after a reboot.
      - if:
          condition:
            lambda: "return id(media_player_sendspin).is_muted() && id(media_player_sendspin).volume > 0.001f;"
          then:
            - media_player.unmute: media_player_sendspin
      - script.execute: show_volume

sensor:
  # Position and length of the Sendspin track in ms, for the progress row.
  - platform: sendspin
    type: track_progress
    id: sendspin_progress
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 1 && id(progress_shown);"
          then:
            - script.execute: update_progress
  - platform: sendspin
    type: track_duration
    id: sendspin_duration
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 1;"
          then:
            - script.execute: update_playing_layout

  # Position and length of the AirPlay track in ms.
  - platform: airplay
    type: track_progress
    id: airplay_progress
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 1 && id(progress_shown);"
          then:
            - script.execute: update_progress
  - platform: airplay
    type: track_duration
    id: airplay_duration
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return id(ui_page) == 1;"
          then:
            - script.execute: update_playing_layout

  # Memory diagnostics in KB, to see whether internal RAM or PSRAM runs low.
  - platform: template
    name: "Heap frei"
    unit_of_measurement: KB
    entity_category: diagnostic
    update_interval: 30s
    lambda: "return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024.0f;"
  - platform: template
    name: "Heap größter Block"
    unit_of_measurement: KB
    entity_category: diagnostic
    update_interval: 30s
    lambda: "return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024.0f;"
  - platform: template
    name: "PSRAM frei"
    unit_of_measurement: KB
    entity_category: diagnostic
    update_interval: 30s
    lambda: "return heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024.0f;"

  - platform: rotary_encoder
    name: "Encoder"
    id: encoder
    internal: true
    pin_a:
      number: GPIO38
      inverted: true
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO47
      inverted: true
      mode:
        input: true
        pullup: true
    on_clockwise:
      - script.execute:
          id: knob_turn
          dir: 1
    on_anticlockwise:
      - script.execute:
          id: knob_turn
          dir: -1

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    name: "Encoder Click"
    id: encoder_click
    internal: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - script.execute: knob_click
    on_multi_click:
      - timing:
          - ON for at least 800ms
        then:
          - script.execute: knob_hold

text_sensor:
  # Device name of the AirPlay sender, e.g. "Marcus' iPhone"; empty while nothing plays. Shown at the top
  # left of the playing screen.
  - platform: airplay
    type: sender
    id: airplay_sender
    name: AirPlay Sender
    on_value:
      - if:
          condition:
            lambda: "return id(airplay_active) && id(ui_page) == 1;"
          then:
            - script.execute: update_playing_layout
  - platform: airplay
    type: title
    id: airplay_title
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return id(airplay_active) && id(ui_page) == 1;"
          then:
            - script.execute: update_playing_layout
  - platform: airplay
    type: artist
    id: airplay_artist
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return id(airplay_active) && id(ui_page) == 1;"
          then:
            - script.execute: update_playing_layout

  # Name of the station playing from the list, for Home Assistant.
  - platform: template
    name: "Sender"
    id: current_station
    icon: mdi:radio

  - platform: wifi_info
    ssid:
      id: wifi_ssid
      internal: true

  - platform: sendspin
    type: title
    id: sendspin_title
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return !id(radio_active) && !id(airplay_active) && id(ui_page) == 1;"
          then:
            - script.execute: update_playing_layout

  - platform: sendspin
    type: artist
    id: sendspin_artist
    internal: true
    on_value:
      - if:
          condition:
            lambda: "return !id(radio_active) && !id(airplay_active) && id(ui_page) == 1;"
          then:
            - script.execute: update_playing_layout

output:
  - platform: ledc
    inverted: True
    pin: GPIO07
    id: output_blk

light:
  # Controlled by the firmware only (dim after "Display abdunkeln nach"), not shown in Home Assistant.
  - platform: monochromatic
    name: "LCD Backlight"
    id: tft_backlight
    internal: true
    output: output_blk
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s

script:
  ######## Stations ########

  # Parse station_blob into the lists, start loading logos and redraw.
  # With no stored list, a few tested MP3 stations are used.
  # Check and store a station list given as "name<TAB>url<TAB>logo" lines, then load it.
  # Used by the web page and by the Home Assistant action.
  - id: store_stations
    parameters:
      text: string
    then:
      - lambda: |-
          auto &blob = id(station_blob);
          std::string out;
          size_t count = 0, pos = 0;
          while (pos < text.size()) {
            size_t end = text.find('\n', pos);
            if (end == std::string::npos) end = text.size();
            std::string line = text.substr(pos, end - pos);
            pos = end + 1;
            if (!line.empty() && line.back() == '\r') line.pop_back();
            const size_t t1 = line.find('\t');
            if (t1 == std::string::npos) continue;
            const size_t t2 = line.find('\t', t1 + 1);
            const std::string name = line.substr(0, t1);
            const std::string url = line.substr(t1 + 1, t2 == std::string::npos ? std::string::npos : t2 - t1 - 1);
            std::string logo = t2 == std::string::npos ? "" : line.substr(t2 + 1);
            if (logo.rfind("http", 0) != 0) logo.clear();
            if (name.empty() || url.rfind("http", 0) != 0) {
              ESP_LOGW("radio", "Skipping \"%s\": name empty or URL not http(s)", name.c_str());
              continue;
            }
            const std::string entry = name + "\t" + url + "\t" + logo + "\n";
            if (out.size() + entry.size() >= blob.size()) {
              ESP_LOGW("radio", "Station list full, kept %u stations", (unsigned) count);
              break;
            }
            out += entry;
            count++;
          }
          std::fill(blob.begin(), blob.end(), 0);
          std::copy(out.begin(), out.end(), blob.begin());
          ESP_LOGI("radio", "Stored %u stations (%u bytes)", (unsigned) count, (unsigned) out.size());
      - script.execute: load_stations

  - id: load_stations
    then:
      - lambda: |-
          static const char *const DEFAULTS =
            "Deutschlandfunk\thttps://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3\t\n"
            "Deutschlandfunk Kultur\thttps://st02.sslstream.dlf.de/dlf/02/128/mp3/stream.mp3\t\n"
            "Deutschlandfunk Nova\thttps://st03.sslstream.dlf.de/dlf/03/128/mp3/stream.mp3\t\n"
            "1LIVE\thttps://wdr-1live-live.icecastssl.wdr.de/wdr/1live/live/mp3/128/stream.mp3\t\n"
            "WDR 2\thttps://wdr-wdr2-rheinland.icecastssl.wdr.de/wdr/wdr2/rheinland/mp3/128/stream.mp3\t\n"
            "SWR3\thttps://liveradio.swr.de/sw282p3/swr3/play.mp3\t\n"
            "Bayern 3\thttps://dispatcher.rndfnk.com/br/br3/live/mp3/mid\t\n"
            "Radio Paradise\thttps://stream.radioparadise.com/mp3-128\t\n";
          const auto &blob = id(station_blob);
          std::string src = blob[0] ? std::string(blob.data(), strnlen(blob.data(), blob.size()))
                                    : std::string(DEFAULTS);
          auto &names = id(station_names);
          auto &urls = id(station_urls);
          auto &logo_urls = id(station_logo_urls);
          names.clear();
          urls.clear();
          logo_urls.clear();
          size_t pos = 0;
          while (pos < src.size()) {
            size_t end = src.find('\n', pos);
            if (end == std::string::npos) end = src.size();
            std::string line = src.substr(pos, end - pos);
            size_t t1 = line.find('\t');
            if (t1 != std::string::npos) {
              size_t t2 = line.find('\t', t1 + 1);
              names.push_back(line.substr(0, t1));
              urls.push_back(line.substr(t1 + 1, t2 == std::string::npos ? std::string::npos : t2 - t1 - 1));
              logo_urls.push_back(t2 == std::string::npos ? "" : line.substr(t2 + 1));
            }
            pos = end + 1;
          }
          if (id(station_index) >= (int) names.size()) id(station_index) = 0;
          id(logos)->load(names, urls, logo_urls);
          ESP_LOGI("radio", "%u stations loaded (%s)", (unsigned) names.size(),
                   blob[0] ? "stored list" : "defaults");
      - script.execute: refresh_logos

  # Redraw what shows station logos.
  - id: refresh_logos
    then:
      - if:
          condition:
            lambda: "return id(ui_page) == 1 && id(radio_active);"
          then:
            - lambda: "id(backdrop_dirty) = true;"
            - script.execute: update_playing_layout
      - if:
          condition:
            lambda: "return id(ui_page) == 2;"
          then:
            - script.execute: render_menu

  # Picking the station that is already playing only returns to the playing screen.
  - id: play_station
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: "return id(radio_active) && id(is_now_playing) && idx == id(station_index);"
          then:
            - script.execute: show_playing
          else:
            - if:
                condition:
                  lambda: "return idx >= 0 && idx < (int) id(station_urls).size();"
                then:
                  - globals.set:
                      id: station_index
                      value: !lambda "return idx;"
                  # Shown right away; check_source confirms it once the station plays.
                  - globals.set:
                      id: radio_active
                      value: 'true'
                  - globals.set:
                      id: airplay_active
                      value: 'false'
                  - globals.set:
                      id: backdrop_dirty
                      value: 'true'
                  - media_player.play_media:
                      id: media_player_sendspin
                      media_url: !lambda "return id(station_urls)[idx];"
                  - lambda: "id(current_station).publish_state(id(station_names)[idx]);"
                  - script.execute: show_playing
                  - script.execute: show_volume
                else:
                  - logger.log:
                      level: WARN
                      format: "No station at index %d"
                      args: [idx]

  # The only writer of radio_active and airplay_active besides play_station: the source that plays or is
  # paused. A source only reports that while it has the speaker, so at most one does; while several do
  # (during a change) or none does, nothing changes. Redraws the playing screen or the main menu on a change.
  - id: check_source
    then:
      - if:
          condition:
            lambda: |-
              using S = media_source::MediaSourceState;
              auto busy = [](media_source::MediaSource *s) {
                return s->get_state() == S::PLAYING || s->get_state() == S::PAUSED;
              };
              const bool air = busy(id(airplay_source)), spin = busy(id(sendspin_source)),
                         http = busy(id(http_source));
              if ((int) air + (int) spin + (int) http != 1)
                return false;
              const bool radio = http, airplay = air;
              if (radio == id(radio_active) && airplay == id(airplay_active))
                return false;
              id(radio_active) = radio;
              id(airplay_active) = airplay;
              id(backdrop_dirty) = true;
              return true;
          then:
            - if:
                condition:
                  lambda: "return id(ui_page) <= 1;"
                then:
                  - script.execute: show_playing
                  - script.execute: show_volume
            - if:
                condition:
                  lambda: "return id(ui_page) == 2 && id(menu) == 0;"
                then:
                  - script.execute: render_menu

  ######## Navigation ########

  - id: show_idle
    then:
      - script.stop: menu_timeout
      - globals.set:
          id: ui_page
          value: '0'
      - script.execute: update_time_labels
      - lvgl.widget.show: clock_date
      - lvgl.widget.hide: clock_vol
      - lvgl.page.show: idle_page
      - script.execute: display_wake

  - id: show_playing
    then:
      - script.stop: menu_timeout
      # From the main menu: the playing screen appears at once and its text fades in. text_opa is
      # inherited by all labels and, unlike opa, needs no full-screen layer.
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu) == 0;"
          then:
            - lambda: |-
                // The animation is keyed to a static variable, not to the page: showing a page
                // deletes all animations of that page and would leave the text invisible.
                static int fade_key;
                lv_obj_set_style_text_opa(id(now_playing_page)->obj, LV_OPA_TRANSP, 0);
                lv_anim_delete(&fade_key, nullptr);
                lv_anim_t a;
                lv_anim_init(&a);
                lv_anim_set_var(&a, &fade_key);
                lv_anim_set_values(&a, LV_OPA_TRANSP, LV_OPA_COVER);
                lv_anim_set_duration(&a, 200);
                lv_anim_set_exec_cb(&a, [](void *, int32_t v) { lv_obj_set_style_text_opa(id(now_playing_page)->obj, v, 0); });
                lv_anim_start(&a);
      - globals.set:
          id: ui_page
          value: '1'
      - script.execute: update_playing_layout
      - lvgl.page.show: now_playing_page
      - script.execute: display_wake

  # The same for stations, AirPlay and Sendspin: darkened, blurred cover (or station logo) as
  # background, title (up to two lines) and artist (or "Webradio"). The row at the bottom shows the
  # playing bars and, for tracks, the progress; or the volume while it changes.
  - id: update_playing_layout
    then:
      - lambda: |-
          using namespace esphome::radio_ui;
          auto clean = [](const std::string &s) {
            std::string out;
            for (unsigned char c : s)
              if (c >= 0x20 && c != 0x7F) out += c;
            return out;
          };
          const lv_font_t *fonts[3] = {id(f24t)->get_lv_font(), id(f20t)->get_lv_font(), id(f16m)->get_lv_font()};
          std::string name, sub, source;
          float duration = NAN, position = NAN;
          if (id(radio_active)) {
            const auto &names = id(station_names);
            const int idx = id(station_index);
            if (idx < 0 || idx >= (int) names.size()) return;
            name = names[idx];
            sub = "Webradio";
          } else {
            const bool air = id(airplay_active);
            name = clean(air ? id(airplay_title).state : id(sendspin_title).state);
            sub = clean(air ? id(airplay_artist).state : id(sendspin_artist).state);
            if (air && name.empty()) name = "AirPlay";
            source = air ? clean(id(airplay_sender).state) : "Sendspin";
            duration = air ? id(airplay_duration).state : id(sendspin_duration).state;
            position = air ? id(airplay_progress).state : id(sendspin_progress).state;
          }
          // Background: the darkened, blurred cover, or the station logo for a station.
          if (id(backdrop_dirty)) {
            id(backdrop_dirty) = false;
            const lv_image_dsc_t *art = nullptr;
            if (id(radio_active)) art = id(logos)->get(3, id(station_index), ${(64*sf)|round|int}, false);
            else if (id(airplay_active)) art = id(airplay_has_cover) ? id(airplay_cover)->get_lv_image_dsc() : nullptr;
            else art = id(sendspin_has_cover) ? id(sendspin_cover_art)->get_lv_image_dsc() : nullptr;
            const lv_image_dsc_t *bd = make_backdrop(art);
            if (bd != nullptr) {
              lv_image_set_src(id(now_bg), bd);
              lv_obj_remove_flag(id(now_bg), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(now_bg), LV_OBJ_FLAG_HIDDEN);
            }
          }
          // Live streams report a length that grows with the position ("6:11 of 6:11"), so 0:00 remains.
          // They and stations show only the playing bars; tracks with time remaining also the bar and time.
          const bool live_stream = !std::isnan(duration) && !std::isnan(position) && std::fabs(duration - position) < 2000;
          id(progress_live) = id(radio_active) || live_stream || std::isnan(duration) || duration <= 0;
          id(progress_shown) = true;
          // Hidden only while the volume row covers it completely (see swap_rows).
          if (id(progress_shown) && id(vol_row_pos) < 255) lv_obj_remove_flag(id(now_prog), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(now_prog), LV_OBJ_FLAG_HIDDEN);

          // Title: the largest font in which it wraps into two lines; artist below in 16 px.
          const lv_font_t *font = fit_lines(name.c_str(), fonts, 3, ${(144*sx)|round|int}, 2);
          const int lh = lv_font_get_line_height(font);
          lv_point_t size;
          lv_text_get_size(&size, name.c_str(), font, 0, 0, ${(144*sx)|round|int}, LV_TEXT_FLAG_NONE);
          const int title_h = std::min<int>(size.y, 2 * lh);
          lv_label_set_text(id(lbl_now_name), name.c_str());
          lv_obj_set_style_text_font(id(lbl_now_name), font, 0);
          lv_obj_set_height(id(lbl_now_name), title_h);
          const int sub_h = sub.empty() ? 0 : ${(22*sy)|round|int};
          // Below the source line when it is shown.
          const int top = std::max((${(108*sy)|round|int} - title_h - sub_h) / 2, source.empty() ? 0 : ${(16*sy)|round|int});
          lv_label_set_text(id(lbl_now_source), source.c_str());
          if (source.empty()) lv_obj_add_flag(id(lbl_now_source), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(lbl_now_source), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(lbl_now_name), top);
          lv_label_set_text(id(lbl_now_sub), sub.c_str());
          lv_obj_set_y(id(lbl_now_sub), top + title_h + ${(2*sy)|round|int});
          if (sub.empty()) lv_obj_add_flag(id(lbl_now_sub), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(lbl_now_sub), LV_OBJ_FLAG_HIDDEN);
      - script.execute: update_progress

  # Progress bar and remaining time of the playing screen, left of the playing bars; once per second
  # while it is shown. Live streams and stations show only the playing bars.
  - id: update_progress
    then:
      - lambda: |-
          if (!id(progress_shown)) return;
          static constexpr int BARS_X = ${bars_x};  // the playing bars take the row from here on
          if (id(progress_live)) {
            lv_obj_add_flag(id(lbl_prog_rem), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(bar_prog), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_remove_flag(id(lbl_prog_rem), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(bar_prog), LV_OBJ_FLAG_HIDDEN);
          float pos = id(sendspin_progress).state, dur = id(sendspin_duration).state;
          if (id(airplay_active)) {
            pos = id(airplay_progress).state;
            dur = id(airplay_duration).state;
          }
          if (std::isnan(dur) || dur <= 0) return;
          if (std::isnan(pos) || pos < 0) pos = 0;
          if (pos > dur) pos = dur;
          lv_bar_set_value(id(bar_prog), (int) (pos * 1000 / dur), LV_ANIM_OFF);
          const int rem = (int) ((dur - pos) / 1000);
          char buf[16];
          if (rem >= 3600)
            snprintf(buf, sizeof(buf), "-%d:%02d:%02d", rem / 3600, rem / 60 % 60, rem % 60);
          else
            snprintf(buf, sizeof(buf), "-%d:%02d", rem / 60, rem % 60);
          lv_label_set_text(id(lbl_prog_rem), buf);
          // The label sits left of the playing bars and the bar takes the rest. Its width fits the
          // longest text of this track ("-88:88" or "-8:88:88" in the widest digit), so neither moves
          // while the digits change; the font's digits differ in width.
          const lv_font_t *font = id(f13m)->get_lv_font();
          static int digit_w = 0;
          if (digit_w == 0)
            for (char c = '0'; c <= '9'; c++)
              digit_w = std::max(digit_w, (int) lv_font_get_glyph_width(font, c, 0));
          const bool hours = dur >= 3600000;
          const int w = lv_font_get_glyph_width(font, '-', 0) + (hours ? 2 : 1) * lv_font_get_glyph_width(font, ':', 0) +
                        (hours ? 5 : 4) * digit_w;
          lv_obj_set_width(id(lbl_prog_rem), w);
          lv_obj_set_x(id(lbl_prog_rem), BARS_X - ${(6*sx)|round|int} - w);
          lv_obj_set_width(id(bar_prog), BARS_X - ${(6*sx)|round|int} - w - ${(8*sx)|round|int});

  # Back to the playing screen when something plays, else to the clock.
  - id: go_home
    then:
      - globals.set:
          id: menu_edit
          value: 'false'
      - if:
          condition:
            or:
              - media_player.is_playing: media_player_sendspin
              - media_player.is_paused: media_player_sendspin
          then:
            - script.execute: show_playing
          else:
            - script.execute: show_idle

  ######## Carousel ########

  # Open the main menu on what plays (the source tile or the station, both first), or the last station.
  - id: open_main
    then:
      - script.execute:
          id: open_menu
          m: 0
          s: !lambda |-
            if (id(is_now_playing)) return 1;
            const int n = (int) id(station_names).size();
            return 1 + std::max(0, std::min(n - 1, (int) id(station_index)));

  # Open a carousel: m = 0 main menu, 1 settings; s = selected tile.
  - id: open_menu
    parameters:
      m: int
      s: int
    then:
      # The tiles settle into place when coming from the playing screen or equalizer, or when
      # switching between main menu and settings.
      - if:
          condition:
            lambda: "return id(ui_page) == 1 || id(ui_page) == 4 || (id(ui_page) == 2 && id(menu) != m);"
          then:
            - script.execute:
                id: menu_settle
                m: !lambda "return m;"
      - globals.set:
          id: menu
          value: !lambda "return m;"
      - globals.set:
          id: menu_sel
          value: !lambda "return s;"
      - globals.set:
          id: menu_edit
          value: 'false'
      - globals.set:
          id: ui_page
          value: '2'
      - script.execute: render_menu
      - if:
          condition:
            lambda: "return m == 1;"
          then:
            - lvgl.page.show: settings_page
          else:
            - lvgl.page.show: carousel_page
      - script.execute: menu_timeout

  # Menu transition, the same for every menu page: the page appears at once and settles in. Main
  # menu: the side tiles slide the last 12 px inwards, the centre tile the last 10 px upwards and
  # the name fades in. Settings: the list slides the last 10 px up. The short travel looks smooth
  # even at the 20-25 frames per second the device reaches while audio plays.
  - id: menu_settle
    parameters:
      m: int
    then:
      - lambda: |-
          if (m == 1) {
            esphome::radio_ui::settle_in(id(set_body));
            return;
          }
          auto step = [](void *, int32_t g) {
            lv_obj_set_x(id(l_root), -${(12*sx)|round|int} * (256 - g) / 256);
            lv_obj_set_x(id(r_root), ${screen_width - tile_side} + ${(12*sx)|round|int} * (256 - g) / 256);
            lv_obj_set_y(id(c_root), ${(20*sy)|round|int} + ${(10*sy)|round|int} * (256 - g) / 256);
            const lv_opa_t t = std::min<int32_t>(255, g);
            lv_obj_set_style_text_opa(id(c_name), t, 0);
            lv_obj_set_style_text_opa(id(c_sub), t, 0);
          };
          lv_anim_delete(id(c_root), nullptr);
          step(nullptr, 0);
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, id(c_root));
          lv_anim_set_values(&a, 0, 256);
          lv_anim_set_duration(&a, 220);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
          lv_anim_set_exec_cb(&a, step);
          lv_anim_start(&a);

  # Build the tiles of the current menu and draw them.
  - id: render_menu
    then:
      - if:
          condition:
            lambda: "return id(menu) == 1;"
          then:
            - script.execute: render_settings
          else:
            - lambda: |-
                using namespace esphome::radio_ui;
                auto icon = [](const char *ic, const std::string &label, const std::string &sub) {
                  Item i;
                  i.kind = Item::ICON;
                  i.icon = ic;
                  i.label = label;
                  i.sub = sub;
                  return i;
                };
                const auto &names = id(station_names);
                const int sel = id(menu_sel);
                const int idx = id(station_index);
                const bool playing = id(radio_active) && id(is_now_playing) && idx >= 0 && idx < (int) names.size();
                std::vector<Item> items;
                if (id(menu) == 0) {
                  // One row: settings, the playing source (AirPlay or Sendspin) or the playing station, then the stations.
                  items.push_back(icon(ICON_SETTINGS, "Einstellungen", ""));
                  if (id(is_now_playing) && !id(radio_active)) {
                    const bool air = id(airplay_active);
                    Item i = icon(ICON_CAST, air ? "AirPlay" : "Sendspin", "");
                    i.letter = air ? "A" : "S";
                    i.playing = true;
                    if (air && id(airplay_has_cover)) i.cover = id(airplay_cover)->get_lv_image_dsc();
                    else if (!air && id(sendspin_has_cover)) i.cover = id(sendspin_cover_art)->get_lv_image_dsc();
                    items.push_back(i);
                  }
                  id(menu_first) = (int) items.size();
                  id(menu_front) = playing ? idx : -1;
                  auto add_station = [&](int k) {
                    Item i;
                    i.kind = Item::STATION;
                    i.station = k;
                    i.label = names[k];
                    i.playing = k == id(menu_front);
                    items.push_back(i);
                  };
                  if (playing) add_station(idx);
                  for (int k = 0; k < (int) names.size(); k++)
                    if (k != id(menu_front)) add_station(k);
                }
                Carousel c{};
                c.name = id(c_name);
                c.sub = id(c_sub);
                c.center = {id(c_root), id(c_logo), id(c_img), id(c_ini), id(c_icon)};
                c.left = {id(l_root), id(l_logo), id(l_img), id(l_ini), id(l_icon)};
                c.right = {id(r_root), id(r_logo), id(r_img), id(r_ini), id(r_icon)};
                c.name_fonts[0] = id(f13m)->get_lv_font();
                c.name_fonts[1] = id(f13m)->get_lv_font();
                c.name_fonts[2] = id(f13m)->get_lv_font();
                id(menu_sel) = std::max(0, std::min(sel, (int) items.size() - 1));
                render(c, items, id(menu_sel), id(logos), names);

  # Settings as a list: the pill marks the selected row and turns amber while the dim time is
  # edited. It jumps to the selected row; set_ink moves against it, see the settings_page widgets.
  - id: render_settings
    then:
      - lambda: |-
          using namespace esphome::radio_ui;
          const int32_t y = ${(24*sy)|round|int} + id(menu_sel) * ${(24*sy)|round|int};
          lv_obj_set_y(id(set_pill), y);
          lv_obj_set_y(id(set_ink), -y);
          lv_obj_set_style_bg_color(id(set_pill), lv_color_hex(id(menu_edit) ? ACCENT : TEXT), 0);
          const std::string val = dim_text(id(dim_after).state);
          lv_label_set_text(id(set_val2), val.c_str());
          lv_label_set_text(id(set_val2_ink), val.c_str());

  # Move the selection by dir within the current menu.
  - id: clamp_sel
    parameters:
      dir: int
    then:
      - lambda: |-
          const int n = id(menu) == 0 ? id(menu_first) + (int) id(station_names).size() : 4;
          id(menu_sel) = std::max(0, std::min(n - 1, id(menu_sel) + dir));

  # Info page: all values on one page.
  - id: open_info
    then:
      - globals.set:
          id: ui_page
          value: '3'
      - lambda: |-
          lv_label_set_text(id(lbl_info_ssid), id(wifi_ssid).state.c_str());
          char buf[24];
          if (std::isnan(id(wifi_signal_strength).state)) snprintf(buf, sizeof(buf), "-");
          else snprintf(buf, sizeof(buf), "%d dBm", (int) id(wifi_signal_strength).state);
          lv_label_set_text(id(lbl_info_rssi), buf);
          lv_label_set_text(id(lbl_info_ip), id(ip_address).state.c_str());
          lv_label_set_text(id(lbl_info_ha), esphome::api::global_api_server->is_connected() ? "verbunden" : "getrennt");
          lv_label_set_text(id(lbl_info_version), ESPHOME_PROJECT_VERSION);
          snprintf(buf, sizeof(buf), "%u", (unsigned) id(station_names).size());
          lv_label_set_text(id(lbl_info_count), buf);
      - lvgl.page.show: info_page
      - script.execute: menu_timeout

  # One level up: settings go to the main menu, info to the settings, the main menu goes home.
  - id: menu_back
    then:
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu_edit);"
          then:
            - globals.set:
                id: menu_edit
                value: 'false'
            - script.execute: render_menu
          else:
            - if:
                condition:
                  lambda: "return id(ui_page) == 2 && id(menu) == 0;"
                then:
                  - script.execute: go_home
                else:
                  - script.execute:
                      id: open_menu
                      m: !lambda "return id(ui_page) == 3 ? 1 : 0;"
                      s: !lambda "return id(ui_page) == 3 ? 3 : 0;"

  # Click on a tile. Main menu: settings, back to the playing source, or play a station.
  # Settings: back, equalizer page, edit the dim time, info page.
  - id: menu_click
    then:
      - if:
          condition:
            lambda: "return id(menu) == 0;"
          then:
            - if:
                condition:
                  lambda: "return id(menu_sel) == 0;"
                then:
                  - script.execute:
                      id: open_menu
                      m: 1
                      s: 1
                else:
                  - if:
                      condition:
                        lambda: "return id(menu_sel) < id(menu_first);"
                      then:
                        - script.execute: go_home
                      else:
                        - script.execute:
                            id: play_station
                            idx: !lambda |-
                              // Tile position to station: the playing station is moved to the front.
                              const int p = id(menu_sel) - id(menu_first);
                              const int front = id(menu_front);
                              if (front < 0) return p;
                              if (p == 0) return front;
                              return p <= front ? p - 1 : p;
          else:
            - if:
                condition:
                  lambda: "return id(menu_sel) == 0;"
                then:
                  - script.execute: menu_back
                else:
                  - if:
                      condition:
                        lambda: "return id(menu_sel) == 1;"
                      then:
                        - script.execute: open_eq
                      else:
                        - if:
                            condition:
                              lambda: "return id(menu_sel) == 2;"
                            then:
                              - lambda: "id(menu_edit) = !id(menu_edit);"
                              - script.execute: render_menu
                            else:
                              - script.execute: open_info

  # Equalizer page (ui_page 4): bass, mid and treble as vertical sliders.
  # Turn selects a band, click switches to editing (accent colour), turn changes it.
  - id: open_eq
    then:
      - globals.set:
          id: eq_edit
          value: 'false'
      - globals.set:
          id: eq_sel
          value: '0'
      - globals.set:
          id: ui_page
          value: '4'
      - script.execute: render_eq
      - lvgl.page.show: eq_page
      - lambda: esphome::radio_ui::settle_in(id(eq_body));
      - script.execute: menu_timeout

  - id: render_eq
    then:
      - lambda: |-
          using namespace esphome::radio_ui;
          esphome::number::Number *nums[3] = {id(eq_bass), id(eq_mid), id(eq_treble)};
          static const float LO[3] = {0, -12, -12}, HI[3] = {9, 6, 6};
          lv_obj_t *fills[3] = {id(eq_fill0), id(eq_fill1), id(eq_fill2)};
          lv_obj_t *knobs[3] = {id(eq_knob0), id(eq_knob1), id(eq_knob2)};
          lv_obj_t *labels[3] = {id(eq_lbl0), id(eq_lbl1), id(eq_lbl2)};
          const int top = ${(24*sy)|round|int}, bottom = ${(24*sy)|round|int + (61*sy)|round|int - 1};  // slider track, see eq_page
          const int sel = id(eq_sel);
          for (int k = 0; k < 3; k++) {
            auto ypos = [&](float v) {
              const float f = (std::min(std::max(v, LO[k]), HI[k]) - LO[k]) / (HI[k] - LO[k]);
              return bottom - (int) lroundf(f * (bottom - top));
            };
            const int cx = ${(31*sx)|round|int + (3*sx)|round|int // 2} + ${(48*sx)|round|int} * k, y = ypos(nums[k]->state), zero = ypos(0);
            const lv_color_t c = lv_color_hex(k == sel ? (id(eq_edit) ? ACCENT : TEXT) : DIM);
            lv_obj_set_pos(fills[k], cx - ${(3*sx)|round|int // 2}, std::min(y, zero));
            lv_obj_set_size(fills[k], ${(3*sx)|round|int}, std::max(1, std::abs(y - zero)));
            lv_obj_set_style_bg_color(fills[k], c, 0);
            lv_obj_set_pos(knobs[k], cx - ${(9*sf)|round|int // 2}, y - ${(9*sf)|round|int // 2});
            lv_obj_set_style_bg_color(knobs[k], c, 0);
            lv_obj_set_style_text_color(labels[k], lv_color_hex(k == sel ? BG : DIM), 0);
          }
          // The selected band's name sits on the pill (amber while editing); the line below shows its value.
          lv_obj_set_x(id(eq_pill), ${(31*sx)|round|int + (3*sx)|round|int // 2} + ${(48*sx)|round|int} * sel - ${(44*sx)|round|int // 2});
          lv_obj_set_style_bg_color(id(eq_pill), lv_color_hex(id(eq_edit) ? ACCENT : TEXT), 0);
          const std::string text = gain_text(nums[sel]->state) + " dB";
          lv_label_set_text(id(eq_value), text.c_str());

  - id: eq_turn
    parameters:
      dir: int
    then:
      - lambda: |-
          if (id(eq_edit)) {
            esphome::number::Number *nums[3] = {id(eq_bass), id(eq_mid), id(eq_treble)};
            auto *num = nums[id(eq_sel)];
            auto call = num->make_call();
            call.set_value(num->state + 0.5f * dir);
            call.perform();
          } else {
            id(eq_sel) = std::max(0, std::min(2, id(eq_sel) + dir));
          }
      - script.execute: render_eq
      - script.execute: menu_timeout

  # Click switches editing of the selected band; hold goes back (eq_back).
  - id: eq_click
    then:
      - lambda: "id(eq_edit) = !id(eq_edit);"
      - script.execute: render_eq
      - script.execute: menu_timeout

  # Hold: leave editing first, then back to the settings menu.
  - id: eq_back
    then:
      - if:
          condition:
            lambda: "return id(eq_edit);"
          then:
            - globals.set:
                id: eq_edit
                value: 'false'
            - script.execute: render_eq
            - script.execute: menu_timeout
          else:
            - script.execute:
                id: open_menu
                m: 1
                s: 1

  # Leave menus, info and the equalizer page after 20 s without input.
  - id: menu_timeout
    mode: restart
    then:
      - delay: 20s
      - if:
          condition:
            lambda: "return id(ui_page) >= 2 && id(ui_page) <= 4;"
          then:
            - script.execute: go_home

  ######## Knob ########

  # While the display is dimmed, the first turn, click or hold only wakes it.

  - id: knob_turn
    mode: queued
    max_runs: 8
    parameters:
      dir: int
    then:
      - if:
          condition:
            lambda: "return id(display_dimmed);"
          then:
            - script.execute: display_wake
          else:
            - script.execute: display_wake
            - if:
                condition:
                  lambda: "return id(ui_page) == 2;"
                then:
                  - if:
                      condition:
                        lambda: "return id(menu_edit);"
                      then:
                        - lambda: |-
                            using namespace esphome::radio_ui;
                            const int k = std::max(0, std::min(DIM_STEP_COUNT - 1, dim_step(id(dim_after).state) + dir));
                            auto call = id(dim_after).make_call();
                            call.set_value(DIM_STEPS[k]);
                            call.perform();
                      else:
                        - script.execute:
                            id: clamp_sel
                            dir: !lambda "return dir;"
                  - script.execute: render_menu
                  - script.execute: menu_timeout
                else:
                  - if:
                      condition:
                        lambda: "return id(ui_page) == 4;"
                      then:
                        - script.execute:
                            id: eq_turn
                            dir: !lambda "return dir;"
                  - if:
                      condition:
                        lambda: "return id(ui_page) <= 1;"
                      then:
                        - lambda: "id(volume_steps) += dir;"
                        - if:
                            condition:
                              not:
                                script.is_running: apply_volume
                            then:
                              - script.execute: apply_volume

  # Apply collected knob steps at most every 120 ms. One volume change per detent
  # (15-20 per second when turning fast) caused audible artifacts; the web slider,
  # which sends at most every 200 ms, did not.
  - id: apply_volume
    mode: single
    then:
      - while:
          condition:
            lambda: "return id(volume_steps) != 0;"
          then:
            - media_player.volume_set:
                id: media_player_sendspin
                volume: !lambda |-
                  const float v = clamp(id(media_player_sendspin).volume + 0.05f * id(volume_steps), 0.0f, 1.0f);
                  id(volume_steps) = 0;
                  return v;
            - delay: 120ms

  - id: knob_click
    then:
      - if:
          condition:
            lambda: "return id(display_dimmed);"
          then:
            - script.execute: display_wake
          else:
            - script.execute: display_wake
            - if:
                condition:
                  lambda: "return id(ui_page) <= 1;"
                then:
                  - script.execute: open_main
                else:
                  # Exclusive branches: menu_click may switch to page 3 or 4.
                  - if:
                      condition:
                        lambda: "return id(ui_page) == 2;"
                      then:
                        - script.execute: menu_click
                        - script.execute: menu_timeout
                      else:
                        - if:
                            condition:
                              lambda: "return id(ui_page) == 3;"
                            then:
                              - script.execute: menu_back
                            else:
                              - if:
                                  condition:
                                    lambda: "return id(ui_page) == 4;"
                                  then:
                                    - script.execute: eq_click

  # Hold: on the clock and playing screen stop playback and open the main menu;
  # elsewhere one level back.
  - id: knob_hold
    then:
      - if:
          condition:
            lambda: "return id(display_dimmed);"
          then:
            - script.execute: display_wake
          else:
            - script.execute: display_wake
            - if:
                condition:
                  lambda: "return id(ui_page) <= 1;"
                then:
                  - if:
                      condition:
                        or:
                          - media_player.is_playing: media_player_sendspin
                          - media_player.is_paused: media_player_sendspin
                      then:
                        - media_player.stop: media_player_sendspin
                        - script.execute: open_main
                else:
                  - if:
                      condition:
                        lambda: "return id(ui_page) == 2 || id(ui_page) == 3;"
                      then:
                        - script.execute: menu_back
                  - if:
                      condition:
                        lambda: "return id(ui_page) == 4;"
                      then:
                        - script.execute: eq_back

  ######## Display ########

  # Full brightness on any input; dims to 30 % after "Display abdunkeln nach" seconds.
  - id: display_wake
    mode: restart
    then:
      - globals.set:
          id: display_dimmed
          value: 'false'
      - light.turn_on:
          id: tft_backlight
          brightness: 100%
      - if:
          condition:
            lambda: "return id(dim_after).state > 0;"
          then:
            - delay: !lambda "return (uint32_t) id(dim_after).state * 1000;"
            - globals.set:
                id: display_dimmed
                value: 'true'
            - light.turn_on:
                id: tft_backlight
                brightness: 30%
                transition_length: 1s

  # Volume row on the playing screen and on the clock.
  - id: refresh_volume
    then:
      - lambda: |-
          using namespace esphome::radio_ui;
          const float v = id(media_player_sendspin).volume;
          const bool muted = v <= 0.001f || id(media_player_sendspin).is_muted();
          const int pct = muted ? 0 : (int) lroundf(v * 100);
          char buf[8];
          snprintf(buf, sizeof(buf), "%d", pct);
          // Muted: a filled speaker with a cross (Material Design Icons) instead of the number.
          static const char *const MUTE_SYMBOL = "󰝟";
          lv_label_set_text(id(lbl_clock_vol), muted ? MUTE_SYMBOL : buf);
          lv_obj_set_style_text_font(id(lbl_clock_vol), muted ? id(mdi18)->get_lv_font() : id(f20m)->get_lv_font(), 0);
          lv_obj_set_style_text_color(id(lbl_clock_vol), lv_color_hex(muted ? SUB : TEXT), 0);
          // Playing screen: the speaker symbol left (crossed out when muted), the number right.
          lv_label_set_text(id(lbl_vol_icon), muted ? MUTE_SYMBOL : "󰕾");
          lv_label_set_text(id(lbl_vol_pct), muted ? "" : buf);
          for (lv_obj_t *bar : {id(bar_vol), id(bar_clock_vol)})
            lv_bar_set_value(bar, pct, LV_ANIM_OFF);

  # Show the volume row for two seconds: on a volume change and when the source changes.
  - id: show_volume
    then:
      - script.execute: refresh_volume
      - lvgl.widget.hide: clock_date
      - lvgl.widget.show: clock_vol
      - script.execute:
          id: swap_rows
          to_volume: true
      - if:
          condition:
            lambda: "return id(ui_page) == 0;"
          then:
            - script.execute: display_wake
      - script.execute: vol_idle

  # Two seconds after the last change: date / progress row back instead of the volume row.
  - id: vol_idle
    mode: restart
    then:
      - delay: 2s
      - lvgl.widget.show: clock_date
      - lvgl.widget.hide: clock_vol
      - script.execute:
          id: swap_rows
          to_volume: false

  # Slide the volume row up over the bottom row (to_volume) or back down; the leaving row slides
  # down and fades out in 0.25 s. A running slide continues from where it is.
  - id: swap_rows
    parameters:
      to_volume: bool
    then:
      - lambda: |-
          const int32_t target = to_volume ? 255 : 0;
          lv_anim_delete(id(now_vol), nullptr);
          if (id(vol_row_pos) == target) return;
          lv_obj_remove_flag(id(now_vol), LV_OBJ_FLAG_HIDDEN);
          if (id(progress_shown)) lv_obj_remove_flag(id(now_prog), LV_OBJ_FLAG_HIDDEN);
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, id(now_vol));
          lv_anim_set_values(&a, id(vol_row_pos), target);
          lv_anim_set_duration(&a, 250 * std::abs(target - id(vol_row_pos)) / 255);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
          lv_anim_set_exec_cb(&a, [](void *, int32_t v) {
            id(vol_row_pos) = v;
            lv_obj_set_y(id(now_vol), ${(106*sy)|round|int} + ${(22*sy)|round|int} * (255 - v) / 255);
            lv_obj_set_style_opa(id(now_vol), v, 0);
            lv_obj_set_y(id(now_prog), ${(106*sy)|round|int} + ${(22*sy)|round|int} * v / 255);
            lv_obj_set_style_opa(id(now_prog), 255 - v, 0);
          });
          lv_anim_set_completed_cb(&a, [](lv_anim_t *) {
            if (id(vol_row_pos) == 255) lv_obj_add_flag(id(now_prog), LV_OBJ_FLAG_HIDDEN);
            if (id(vol_row_pos) == 0) lv_obj_add_flag(id(now_vol), LV_OBJ_FLAG_HIDDEN);
          });
          lv_anim_start(&a);

  - id: update_time_labels
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          static const char *const DAYS[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch",
                                             "Donnerstag", "Freitag", "Samstag"};
          static const char *const MONTHS[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
                                               "August", "September", "Oktober", "November", "Dezember"};
          char buf[40];
          snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
          lv_label_set_text(id(lbl_idle_time), buf);
          for (lv_obj_t *l : {id(hdr_time_main), id(hdr_time_set), id(hdr_time_info), id(hdr_time_eq)})
            lv_label_set_text(l, buf);
          lv_label_set_text(id(lbl_idle_day), DAYS[t.day_of_week - 1]);
          snprintf(buf, sizeof(buf), "%d. %s", t.day_of_month, MONTHS[t.month - 1]);
          lv_label_set_text(id(lbl_idle_date), buf);

  - id: idle_timeout
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            lambda: "return id(ui_page) == 1;"
          then:
            - script.execute: show_idle

# ST7735 160x128. Another display: a package from displays/ removes this one by its id.
display:
  - platform: mipi_spi
    id: tft_display
    model: ST7735
    data_rate: 40Mhz
    dimensions:
      height: 160
      width: 128
      offset_height: 1
      offset_width: 2
      # Controller memory is 132x162. With 270 degree rotation the driver uses
      # pad_height as the horizontal offset, so both pads must match the panel.
      pad_height: 1
      pad_width: 2
    cs_pin: GPIO17
    dc_pin: GPIO18
    reset_pin: GPIO08

image:
  - platform: sendspin
    id: sendspin_cover_slot
    format: JPEG
    type: RGB565
    resize: ${logo_size}x${logo_size}
    source: ALBUM
    current_image:
      id: sendspin_cover_art
    on_image_display:
      - lambda: |-
          id(sendspin_has_cover) = true;
          id(backdrop_dirty) = true;
      - script.execute: update_playing_layout
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu) == 0;"
          then:
            - script.execute: render_menu
    on_image_clear:
      - lambda: |-
          id(sendspin_has_cover) = false;
          id(backdrop_dirty) = true;
      - script.execute: update_playing_layout
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu) == 0;"
          then:
            - script.execute: render_menu
    on_image_error:
      - logger.log: "Cover art: no image available"
      - lambda: |-
          id(sendspin_has_cover) = false;
          id(backdrop_dirty) = true;
      - script.execute: update_playing_layout

  # Cover from the AirPlay sender; shown by update_playing_layout while AirPlay plays.
  - platform: airplay
    id: airplay_cover
    type: RGB565
    resize: ${logo_size}x${logo_size}
    on_image_update:
      - lambda: |-
          id(airplay_has_cover) = true;
          id(backdrop_dirty) = true;
      - script.execute: update_playing_layout
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu) == 0;"
          then:
            - script.execute: render_menu
    on_image_clear:
      - lambda: |-
          id(airplay_has_cover) = false;
          id(backdrop_dirty) = true;
      - script.execute: update_playing_layout
      - if:
          condition:
            lambda: "return id(ui_page) == 2 && id(menu) == 0;"
          then:
            - script.execute: render_menu
    on_image_error:
      - logger.log: "AirPlay cover could not be decoded"

# Montserrat with Latin glyphs (umlauts). Medium weight, because thin strokes
# vanish on the TN panel at an angle.
font:
  - {file: "gfonts://Montserrat@500", id: f10m, size: "${(10*sf)|round|int}", bpp: 4, glyphsets: [GF_Latin_Core]}
  - {file: "gfonts://Montserrat@500", id: f11m, size: "${(11*sf)|round|int}", bpp: 4, glyphsets: [GF_Latin_Core]}
  - {file: "gfonts://Montserrat@500", id: f12m, size: "${(12*sf)|round|int}", bpp: 4, glyphsets: [GF_Latin_Core]}
  - {file: "gfonts://Montserrat@500", id: f13m, size: "${(13*sf)|round|int}", bpp: 4, glyphsets: [GF_Latin_Core]}
  - {file: "gfonts://Montserrat@500", id: f16m, size: "${(16*sf)|round|int}", bpp: 4, glyphsets: [GF_Latin_Core]}
  - {file: "gfonts://Montserrat@500", id: f20m, size: "${(20*sf)|round|int}", bpp: 4, glyphs: "0123456789"}
  - {file: "gfonts://Montserrat@500", id: f20t, size: "${(20*sf)|round|int}", bpp: 4, glyphsets: [GF_Latin_Core]}
  # Mute symbol (Material Design Icons "volume-mute").
  - {file: {type: web, url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"}, id: mdi18, size: "${(18*sf)|round|int}", bpp: 4, glyphs: ["󰝟", "󰕾"]}
  - {file: "gfonts://Montserrat@500", id: f24t, size: "${(24*sf)|round|int}", bpp: 4, glyphsets: [GF_Latin_Core]}
  - {file: "gfonts://Montserrat", id: f44r, size: "${(44*sf)|round|int}", bpp: 4, glyphs: "0123456789:-"}

  # Tabler line icons of the settings list: back, equalizer, dim, info, chevron.
  - {file: {type: web, url: '${tabler_font}'}, id: ti16, size: "${(16*sf)|round|int}", bpp: 4, glyphs: ["", "", "", "", ""]}
  # Main menu icons: settings, cast; the radio on the startup page (ti40 only).
  - {file: {type: web, url: '${tabler_font}'}, id: ti24, size: "${(24*sf)|round|int}", bpp: 4, glyphs: ["", ""]}
  - {file: {type: web, url: '${tabler_font}'}, id: ti40, size: "${(40*sf)|round|int}", bpp: 4, glyphs: ["", "", ""]}
  # Cover placeholder on the playing screen.
  - {file: {type: web, url: '${tabler_font}'}, id: ti34, size: "${(34*sf)|round|int}", bpp: 4, glyphs: [""]}

########################################################################
# Colours (see radio_ui.h): background 0x060608, text 0xFFFFFF, secondary
# 0xC4C4CC, dim 0x787880, track 0x46464E, accent 0xFFB020 (only while editing).

lvgl:
  rotation: 270
  default_font: f12m
  style_definitions:
    - id: page_style
      bg_color: 0x060608
      bg_opa: COVER
    - id: plain
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
    # No clip_corner: logos carry their rounded corners in the pixels, so LVGL
    # does not need a temporary layer buffer for every redraw.
    - id: logo_box
      bg_color: 0x26262E
      bg_opa: COVER
      border_width: 0
      pad_all: 0

  pages:
    - id: boot_page
      styles: page_style
      scrollable: false
      widgets:
        - label: {text: "", x: 0, y: "${(20*sy)|round|int}", width: "${(160*sx)|round|int}", text_align: CENTER, text_font: ti40, text_color: 0xFFFFFF}
        - label: {text: "Web Radio", x: 0, y: "${(68*sy)|round|int}", width: "${(160*sx)|round|int}", text_align: CENTER, text_font: f13m, text_color: 0xFFFFFF}
        - label: {id: lbl_boot_status, text: "Verbinde mit WLAN …", x: 0, y: "${(88*sy)|round|int}", width: "${(160*sx)|round|int}", text_align: CENTER, text_font: f11m, text_color: 0xC4C4CC}
        - obj: {x: "${(50*sx)|round|int}", y: "${(110*sy)|round|int}", width: "${(60*sx)|round|int}", height: "${(3*sy)|round|int}", radius: "${(1*sf)|round|int}", bg_color: 0x46464E, bg_opa: COVER, border_width: 0, pad_all: 0}
        - obj: {id: boot_seg, x: "${(50*sx)|round|int}", y: "${(110*sy)|round|int}", width: "${(16*sx)|round|int}", height: "${(3*sy)|round|int}", radius: "${(1*sf)|round|int}", bg_color: 0xFFFFFF, bg_opa: COVER, border_width: 0, pad_all: 0}

    # 0: Clock. Turning shows the volume row instead of weekday and date.
    - id: idle_page
      styles: page_style
      scrollable: false
      widgets:
        - label: {id: lbl_idle_time, text: "--:--", x: 0, y: "${(17*sy)|round|int}", width: "${(160*sx)|round|int}", text_align: CENTER, text_font: f44r, text_color: 0xFFFFFF}
        - obj:
            id: clock_date
            styles: plain
            x: 0
            y: "${(70*sy)|round|int}"
            width: "${(160*sx)|round|int}"
            height: "${(42*sy)|round|int}"
            widgets:
              - label: {id: lbl_idle_day, text: "", x: 0, y: 0, width: "${(160*sx)|round|int}", text_align: CENTER, text_font: f16m, text_color: 0xC4C4CC}
              - label: {id: lbl_idle_date, text: "", x: 0, y: "${(21*sy)|round|int}", width: "${(160*sx)|round|int}", text_align: CENTER, text_font: f16m, text_color: 0xC4C4CC}
        - obj:
            id: clock_vol
            styles: plain
            x: 0
            y: "${(78*sy)|round|int}"
            width: "${(160*sx)|round|int}"
            height: "${(34*sy)|round|int}"
            hidden: true
            widgets:
              - label: {id: lbl_clock_vol, text: "", x: 0, y: 0, width: "${(160*sx)|round|int}", text_align: CENTER, text_font: f20m, text_color: 0xFFFFFF}
              - bar:
                  id: bar_clock_vol
                  x: "${(20*sx)|round|int}"
                  y: "${(28*sy)|round|int}"
                  width: "${(120*sx)|round|int}"
                  height: "${(6*sy)|round|int}"
                  min_value: 0
                  max_value: 100
                  value: 50
                  radius: "${(3*sf)|round|int}"
                  bg_color: 0x46464E
                  bg_opa: COVER
                  indicator:
                    bg_color: 0xFFB020
                    radius: "${(3*sf)|round|int}"

    # 1: Playing. The cover (or the station logo) as darkened background, title and artist (or
    # "Webradio"), and a row with progress, remaining time and the playing bars.
    - id: now_playing_page
      styles: page_style
      # The bottom rows slide below the screen edge (swap_rows); that must not make the page scroll.
      scrollable: false
      widgets:
        - image: {id: now_bg, src: sendspin_cover_art, x: 0, y: 0, hidden: true}
        - label: {id: lbl_now_name, text: "", x: "${(8*sx)|round|int}", y: "${(20*sy)|round|int}", width: "${(144*sx)|round|int}", height: "${(58*sy)|round|int}", long_mode: DOT, text_font: f24t, text_color: 0xFFFFFF}
        - label: {id: lbl_now_sub, text: "", x: "${(8*sx)|round|int}", y: "${(80*sy)|round|int}", width: "${(144*sx)|round|int}", height: "${(20*sy)|round|int}", long_mode: DOT, text_font: f16m, text_color: 0xE1E1E8}
        # Where the audio comes from: the AirPlay sender's device name or "Sendspin" (the component does not report the server name); empty for a station.
        - label: {id: lbl_now_source, text: "", x: "${(8*sx)|round|int + corner_inset}", y: "${(3*sy)|round|int}", width: "${(120*sx)|round|int - corner_inset}", height: "${(15*sy)|round|int}", long_mode: DOT, text_font: f12m, text_color: 0xC4C4CC, hidden: true}
        - obj:
            id: now_prog
            styles: plain
            x: "${(8*sx)|round|int + corner_inset}"
            y: "${(106*sy)|round|int}"
            width: "${row_width}"
            height: "${(20*sy)|round|int}"
            scrollable: false
            hidden: true
            widgets:
              - label: {id: lbl_prog_rem, text: "", x: "${(88*sx)|round|int}", y: "${(2*sy)|round|int}", width: "${(37*sx)|round|int}", text_align: RIGHT, text_font: f13m, text_color: 0xE1E1E8}
              # Playing bars at the right end; the 60 ms interval moves them while something plays.
              - obj: {id: ind0, styles: plain, x: "${bars_x}", y: "${(13*sy)|round|int}", width: "${(3*sf)|round|int}", height: "${(3*sf)|round|int}", bg_color: 0xE1E1E8, bg_opa: COVER, radius: 0}
              - obj: {id: ind1, styles: plain, x: "${bars_x + (5*sx)|round|int}", y: "${(13*sy)|round|int}", width: "${(3*sf)|round|int}", height: "${(3*sf)|round|int}", bg_color: 0xE1E1E8, bg_opa: COVER, radius: 0}
              - obj: {id: ind2, styles: plain, x: "${bars_x + (10*sx)|round|int}", y: "${(13*sy)|round|int}", width: "${(3*sf)|round|int}", height: "${(3*sf)|round|int}", bg_color: 0xE1E1E8, bg_opa: COVER, radius: 0}
              # Pause symbol in place of the playing bars, as tall as the highest bar.
              - obj:
                  id: pause_overlay
                  styles: plain
                  x: "${bars_x}"
                  y: "${(4*sy)|round|int}"
                  width: "${(13*sx)|round|int}"
                  height: "${(12*sy)|round|int}"
                  hidden: true
                  widgets:
                    - obj: {styles: plain, x: "${(2*sx)|round|int}", y: 0, width: "${(3*sx)|round|int}", height: "${(12*sy)|round|int}", bg_color: 0xE1E1E8, bg_opa: COVER, radius: 0}
                    - obj: {styles: plain, x: "${(8*sx)|round|int}", y: 0, width: "${(3*sx)|round|int}", height: "${(12*sy)|round|int}", bg_color: 0xE1E1E8, bg_opa: COVER, radius: 0}
              - bar:
                  id: bar_prog
                  x: 0
                  y: "${(8*sy)|round|int}"
                  width: "${(100*sx)|round|int}"
                  height: "${(4*sy)|round|int}"
                  min_value: 0
                  max_value: 1000
                  value: 0
                  radius: 0
                  bg_color: 0x6E6E76
                  bg_opa: COVER
                  indicator:
                    bg_color: 0xFFB020
                    radius: 0
        - obj:
            id: now_vol
            styles: plain
            x: "${(8*sx)|round|int + corner_inset}"
            y: "${(106*sy)|round|int}"
            width: "${row_width}"
            height: "${(20*sy)|round|int}"
            scrollable: false
            hidden: true
            widgets:
              # Speaker (crossed out when muted), the volume as bar and as number.
              - label: {id: lbl_vol_icon, text: "󰕾", x: 0, y: "${(1*sy)|round|int}", text_font: mdi18, text_color: 0xE1E1E8}
              - label: {id: lbl_vol_pct, text: "", x: "${row_width - (28*sx)|round|int}", y: "${(2*sy)|round|int}", width: "${(28*sx)|round|int}", text_align: RIGHT, text_font: f13m, text_color: 0xE1E1E8}
              - bar:
                  id: bar_vol
                  x: "${(24*sx)|round|int}"
                  y: "${(8*sy)|round|int}"
                  width: "${row_width - (24*sx)|round|int - (34*sx)|round|int}"
                  height: "${(4*sy)|round|int}"
                  min_value: 0
                  max_value: 100
                  value: 50
                  radius: 0
                  bg_color: 0x6E6E76
                  bg_opa: COVER
                  indicator:
                    bg_color: 0xFFB020
                    radius: 0

    # 2: Carousel for all menus, filled by render_menu / radio_ui::render.
    - id: carousel_page
      styles: page_style
      # The side tiles start partly outside the screen in menu_settle; that must not make the page scroll.
      scrollable: false
      widgets:
        - label: {text: "Radio", x: "${(8*sx)|round|int + corner_inset}", y: "${(4*sy)|round|int}", text_font: f13m, text_color: 0xFFFFFF}
        - label: {id: hdr_time_main, text: "", x: "${(112*sx)|round|int - corner_inset}", y: "${(5*sy)|round|int}", width: "${(40*sx)|round|int}", text_align: RIGHT, text_font: f12m, text_color: 0xC4C4CC}
        - obj:
            id: c_root
            styles: plain
            x: "${(screen_width - tile_center) // 2}"
            y: "${(20*sy)|round|int}"
            width: "${tile_center}"
            height: "${tile_center}"
            widgets:
              - obj:
                  id: c_logo
                  styles: logo_box
                  x: 0
                  y: 0
                  width: "${tile_center}"
                  height: "${tile_center}"
                  radius: "${(14*sf)|round|int}"
                  scrollable: false
                  hidden: true
                  widgets:
                    - image: {id: c_img, src: sendspin_cover_art, x: 0, y: 0, hidden: true}
                    - label: {id: c_ini, text: "", align: CENTER, text_font: f16m, text_color: 0xC4C4CC}
              - label: {id: c_icon, text: "", align: CENTER, text_font: ti40, text_color: 0xFFFFFF, hidden: true}
        - obj:
            id: l_root
            styles: plain
            x: 0
            y: "${(20*sy)|round|int + (tile_center - tile_side) // 2}"
            width: "${tile_side}"
            height: "${tile_side}"
            widgets:
              - obj:
                  id: l_logo
                  styles: logo_box
                  x: 0
                  y: 0
                  width: "${tile_side}"
                  height: "${tile_side}"
                  radius: "${(8*sf)|round|int}"
                  scrollable: false
                  hidden: true
                  widgets:
                    - image: {id: l_img, src: sendspin_cover_art, x: 0, y: 0, hidden: true}
                    - label: {id: l_ini, text: "", align: CENTER, text_font: f10m, text_color: 0xC4C4CC}
              - label: {id: l_icon, text: "", align: CENTER, text_font: ti24, text_color: 0xFFFFFF, hidden: true}
        - obj:
            id: r_root
            styles: plain
            x: "${screen_width - tile_side}"
            y: "${(20*sy)|round|int + (tile_center - tile_side) // 2}"
            width: "${tile_side}"
            height: "${tile_side}"
            widgets:
              - obj:
                  id: r_logo
                  styles: logo_box
                  x: 0
                  y: 0
                  width: "${tile_side}"
                  height: "${tile_side}"
                  radius: "${(8*sf)|round|int}"
                  scrollable: false
                  hidden: true
                  widgets:
                    - image: {id: r_img, src: sendspin_cover_art, x: 0, y: 0, hidden: true}
                    - label: {id: r_ini, text: "", align: CENTER, text_font: f10m, text_color: 0xC4C4CC}
              - label: {id: r_icon, text: "", align: CENTER, text_font: ti24, text_color: 0xFFFFFF, hidden: true}
        - label: {id: c_name, text: "", height: "${(16*sy)|round|int}", x: "${(6*sx)|round|int}", y: "${(97*sy)|round|int}", width: "${(148*sx)|round|int}", long_mode: SCROLL_CIRCULAR, text_align: CENTER, text_font: f13m, text_color: 0xFFFFFF}
        - label: {id: c_sub, text: "", height: "${(15*sy)|round|int}", x: "${(6*sx)|round|int}", y: "${(112*sy)|round|int}", width: "${(148*sx)|round|int}", long_mode: DOT, text_align: CENTER, text_font: f12m, text_color: 0xC4C4CC}

    # 2 with menu 1: Settings as a list, see render_settings.
    - id: settings_page
      styles: page_style
      scrollable: false
      widgets:
        - label: {text: "Einstellungen", x: "${(8*sx)|round|int + corner_inset}", y: "${(4*sy)|round|int}", text_font: f13m, text_color: 0xFFFFFF}
        - label: {id: hdr_time_set, text: "", x: "${(112*sx)|round|int - corner_inset}", y: "${(5*sy)|round|int}", width: "${(40*sx)|round|int}", text_align: RIGHT, text_font: f12m, text_color: 0xC4C4CC}
        # Everything below the header in one box, so the page can settle in (radio_ui::settle_in).
        - obj:
            id: set_body
            styles: plain
            x: 0
            y: 0
            width: "${(160*sx)|round|int}"
            height: "${(128*sy)|round|int}"
            scrollable: false
            widgets:
              - label: {text: "", x: "${(12*sx)|round|int}", y: "${(28*sy)|round|int}", text_font: ti16, text_color: 0xFFFFFF}
              - label: {text: "Zurück", x: "${(34*sx)|round|int}", y: "${(28*sy)|round|int}", text_font: f13m, text_color: 0xFFFFFF}
              - label: {text: "", x: "${(12*sx)|round|int}", y: "${(52*sy)|round|int}", text_font: ti16, text_color: 0xFFFFFF}
              - label: {text: "Equalizer", x: "${(34*sx)|round|int}", y: "${(52*sy)|round|int}", text_font: f13m, text_color: 0xFFFFFF}
              - label: {text: "", x: "${(136*sx)|round|int}", y: "${(52*sy)|round|int}", text_font: ti16, text_color: 0x787880}
              - label: {text: "", x: "${(12*sx)|round|int}", y: "${(76*sy)|round|int}", text_font: ti16, text_color: 0xFFFFFF}
              - label: {text: "Abdunkeln", x: "${(34*sx)|round|int}", y: "${(76*sy)|round|int}", text_font: f13m, text_color: 0xFFFFFF}
              - label: {id: set_val2, text: "", x: "${(92*sx)|round|int}", y: "${(76*sy)|round|int}", width: "${(56*sx)|round|int}", text_align: RIGHT, text_font: f12m, text_color: 0xC4C4CC}
              - label: {text: "", x: "${(12*sx)|round|int}", y: "${(100*sy)|round|int}", text_font: ti16, text_color: 0xFFFFFF}
              - label: {text: "Info", x: "${(34*sx)|round|int}", y: "${(100*sy)|round|int}", text_font: f13m, text_color: 0xFFFFFF}
              - label: {text: "", x: "${(136*sx)|round|int}", y: "${(100*sy)|round|int}", text_font: ti16, text_color: 0x787880}
              # The pill lies above the rows and holds a dark copy of them in set_ink, shifted against
              # the pill so the copy lines up with the rows. The rows themselves are never recoloured.
              - obj:
                  id: set_pill
                  x: "${(4*sx)|round|int}"
                  y: "${(48*sy)|round|int}"
                  width: "${(152*sx)|round|int}"
                  height: "${(24*sy)|round|int}"
                  radius: "${(12*sf)|round|int}"
                  bg_color: 0xFFFFFF
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        id: set_ink
                        styles: plain
                        x: "${(-4*sx)|round|int}"
                        y: "${(-48*sy)|round|int}"
                        width: "${(160*sx)|round|int}"
                        height: "${(128*sy)|round|int}"
                        scrollable: false
                        widgets:
                          - label: {text: "", x: "${(12*sx)|round|int}", y: "${(28*sy)|round|int}", text_font: ti16, text_color: 0x060608}
                          - label: {text: "Zurück", x: "${(34*sx)|round|int}", y: "${(28*sy)|round|int}", text_font: f13m, text_color: 0x060608}
                          - label: {text: "", x: "${(12*sx)|round|int}", y: "${(52*sy)|round|int}", text_font: ti16, text_color: 0x060608}
                          - label: {text: "Equalizer", x: "${(34*sx)|round|int}", y: "${(52*sy)|round|int}", text_font: f13m, text_color: 0x060608}
                          - label: {text: "", x: "${(136*sx)|round|int}", y: "${(52*sy)|round|int}", text_font: ti16, text_color: 0x46464E}
                          - label: {text: "", x: "${(12*sx)|round|int}", y: "${(76*sy)|round|int}", text_font: ti16, text_color: 0x060608}
                          - label: {text: "Abdunkeln", x: "${(34*sx)|round|int}", y: "${(76*sy)|round|int}", text_font: f13m, text_color: 0x060608}
                          - label: {id: set_val2_ink, text: "", x: "${(92*sx)|round|int}", y: "${(76*sy)|round|int}", width: "${(56*sx)|round|int}", text_align: RIGHT, text_font: f12m, text_color: 0x060608}
                          - label: {text: "", x: "${(12*sx)|round|int}", y: "${(100*sy)|round|int}", text_font: ti16, text_color: 0x060608}
                          - label: {text: "Info", x: "${(34*sx)|round|int}", y: "${(100*sy)|round|int}", text_font: f13m, text_color: 0x060608}
                          - label: {text: "", x: "${(136*sx)|round|int}", y: "${(100*sy)|round|int}", text_font: ti16, text_color: 0x46464E}

    # 3: Info, all values on one page. Click or hold returns to the menu.
    - id: info_page
      styles: page_style
      scrollable: false
      widgets:
        - label: {text: "Info", x: "${(8*sx)|round|int + corner_inset}", y: "${(4*sy)|round|int}", text_font: f13m, text_color: 0xFFFFFF}
        - label: {id: hdr_time_info, text: "", x: "${(112*sx)|round|int - corner_inset}", y: "${(5*sy)|round|int}", width: "${(40*sx)|round|int}", text_align: RIGHT, text_font: f12m, text_color: 0xC4C4CC}
        - label: {text: "WLAN", x: "${(8*sx)|round|int}", y: "${(25*sy)|round|int}", text_font: f12m, text_color: 0xC4C4CC}
        - label: {id: lbl_info_ssid, text: "", height: "${(15*sy)|round|int}", x: "${(60*sx)|round|int}", y: "${(25*sy)|round|int}", width: "${(92*sx)|round|int}", long_mode: DOT, text_align: RIGHT, text_font: f12m, text_color: 0xFFFFFF}
        - label: {text: "Signal", x: "${(8*sx)|round|int}", y: "${(42*sy)|round|int}", text_font: f12m, text_color: 0xC4C4CC}
        - label: {id: lbl_info_rssi, text: "", height: "${(15*sy)|round|int}", x: "${(60*sx)|round|int}", y: "${(42*sy)|round|int}", width: "${(92*sx)|round|int}", long_mode: DOT, text_align: RIGHT, text_font: f12m, text_color: 0xFFFFFF}
        - label: {text: "IP", x: "${(8*sx)|round|int}", y: "${(59*sy)|round|int}", text_font: f12m, text_color: 0xC4C4CC}
